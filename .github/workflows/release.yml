name: Release

on:
  push:
    branches:
    - releases/v*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Compose the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      head: ${{ steps.version.outputs.head }}
      image: ${{ steps.version.outputs.image }}
    steps:
    - name: Compose the HeadVer version
      id: version
      run: |
        set -euo pipefail

        head="${GITHUB_REF_NAME#releases/v}"
        case "${head}" in
          '' | *[!0-9]*)
            echo "::error::${GITHUB_REF_NAME} does not name a release line: expected releases/v<number>"
            exit 1
            ;;
        esac

        version="${head}.$(date -u +%G%V | cut -c3-).${GITHUB_RUN_NUMBER}"
        image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

        {
          echo "head=${head}"
          echo "version=${version}"
          echo "image=${image}"
        } >> "${GITHUB_OUTPUT}"

        echo "Publishing \`${image}:${version}\`" >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build linux/${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to ${{ env.REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push linux/${{ matrix.arch }}
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        push: true
        tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
        build-args: |
          VERSION=${{ needs.version.outputs.version }}
        labels: |
          org.opencontainers.image.title=lsqlited
          org.opencontainers.image.description=Lightweight daemon serving SQLite databases over TCP
          org.opencontainers.image.version=${{ needs.version.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.licenses=MIT
        provenance: false
        sbom: false
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.arch }}

    - name: Verify the linux/${{ matrix.arch }} image
      env:
        IMAGE: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
        WANT: ${{ needs.version.outputs.version }}
      run: |
        set -euo pipefail

        got="$(docker run --rm "${IMAGE}" -version)"
        if [ "${got}" != "${WANT}" ]; then
          echo "::error::${IMAGE} reports version ${got}"
          exit 1
        fi

  manifest:
    name: Publish the manifest list
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to ${{ env.REGISTRY }}
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create the manifest list
      env:
        IMAGE: ${{ needs.version.outputs.image }}
        VERSION: ${{ needs.version.outputs.version }}
        HEAD: ${{ needs.version.outputs.head }}
      run: |
        set -euo pipefail

        docker buildx imagetools create \
          --tag "${IMAGE}:${VERSION}" \
          --tag "${IMAGE}:${HEAD}" \
          "${IMAGE}:${VERSION}-amd64" \
          "${IMAGE}:${VERSION}-arm64"

    - name: Verify the manifest list
      env:
        IMAGE: ${{ needs.version.outputs.image }}
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        set -euo pipefail

        platforms="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" |
          jq -r '.manifests[].platform | .os + "/" + .architecture' | sort | tr '\n' ' ')"
        for want in linux/amd64 linux/arm64; do
          case " ${platforms} " in
            *" ${want} "*) ;;
            *)
              echo "::error::${IMAGE}:${VERSION} covers ${platforms}, without ${want}"
              exit 1
              ;;
          esac
        done

        got="$(docker run --rm "${IMAGE}:${VERSION}" -version)"
        if [ "${got}" != "${VERSION}" ]; then
          echo "::error::${IMAGE}:${VERSION} reports version ${got}"
          exit 1
        fi

        echo "\`${IMAGE}:${VERSION}\` covers ${platforms}and reports \`${got}\`" >> "${GITHUB_STEP_SUMMARY}"
