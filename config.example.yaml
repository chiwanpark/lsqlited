# Example lsqlited configuration.

listen:
  # Address to bind to. Leave empty to listen on all interfaces.
  host: 127.0.0.1
  # TCP port to listen on.
  port: 7890

# Transport security. Omit the whole section to serve plaintext TCP, in which
# case queries and results are readable by anyone on the path. Clients opt in
# with the ssl_* DSN parameters:
#   lsqlited://alice:s3cret@db.example.com:7890/app?ssl_ca=/etc/ssl/ca.crt
tls:
  # PEM certificate presented to clients. If it was signed by an intermediate
  # CA, append the intermediates to this file so clients can build the chain.
  cert: /etc/lsqlited/server.crt
  # PEM private key matching `cert`. Keep it readable only by the daemon.
  key: /etc/lsqlited/server.key
  # Optional: PEM bundle of CAs allowed to sign client certificates. Setting
  # it turns on mutual TLS, so clients must present a certificate of their
  # own (ssl_cert/ssl_key in the DSN). This authenticates the connection;
  # accounts are still authenticated by `auth` below.
  client_ca: /etc/lsqlited/clients-ca.crt
  # Optional: lowest TLS version to negotiate, "1.2" (default) or "1.3".
  min_version: "1.2"

# SQLite open parameters applied to every database below. Accepts a query
# string (params: _journal_mode=WAL&cache=shared) or a mapping. Parameters set
# on an individual database take precedence over these.
# _busy_timeout defaults to 5000 unless overridden here or per database.
params:
  _journal_mode: WAL
  _foreign_keys: true

# Loadable SQLite extensions registered on every connection to every database
# below. Each entry is either the path of a shared library, or a mapping that
# also names the initialization symbol to call. Extensions listed on an
# individual database are loaded in addition to these.
#
# Extensions run inside the daemon with its full privileges, so only load
# libraries you trust.
extensions:
  # Entry point left to SQLite: sqlite3_extension_init, or a name derived
  # from the file name.
  - /usr/lib/sqlite3/vector0.so
  - path: /usr/lib/sqlite3/misc.so
    entrypoint: sqlite3_misc_init

# Client authentication. Omit the whole section (or leave `users` empty) to
# accept every connection without authenticating it. Clients then pass their
# credentials in the DSN: lsqlited://alice:s3cret@127.0.0.1:7890/app
#
# The password is never sent over the network: the server issues a random
# challenge and the client answers with a proof derived from the password.
auth:
  # PBKDF2 iteration count used for `password:` entries below and advertised
  # for unknown users (default: 4096). Clients run the derivation once per
  # connection, so raising this makes connecting measurably slower.
  iterations: 4096
  users:
    alice:
      # Recommended: a precomputed verifier, so the password itself never
      # appears in this file. Generate one with:
      #   printf '%s' 's3cret' | lsqlited -hash-password
      verifier: "SCRAM-SHA-256$4096:4X/1OevPJo0nxVmGMhochg==$hUeU8yswZ8nWH3GIkn1BAc5zwfLC7yDoOiDYnYSunAE=:aX9c/LVO0TcYRedgwLyvphjukETWWUwHn0uFJgprzew="
      # Databases this account may use. Every name must appear under
      # `databases` below. Omit the key to grant access to all of them.
      databases: [app, metrics]
    bob:
      # Convenient, but leaves the password readable in this file. Use only
      # if the file permissions make that acceptable.
      password: hunter2
      databases: [archive]
    admin:
      password: letmein
      # No `databases` key: access to every database configured below.
    intern:
      password: temporary
      # An empty list grants nothing, which suspends the account without
      # deleting its credentials.
      databases: []

# Databases served by this daemon, keyed by logical name. Clients refer to
# a database by its logical name, e.g. lsqlited://127.0.0.1:7890/app
databases:
  app:
    # Path to the SQLite database file. Created on first write if missing.
    path: /var/lib/lsqlited/app.sqlite3
  metrics:
    path: /var/lib/lsqlited/metrics.sqlite3
    # SQLite busy timeout in milliseconds (default: 5000).
    params: _busy_timeout=10000
  archive:
    path: /var/lib/lsqlited/archive.sqlite3
    # Extra SQLite DSN parameters appended to the file: URI used to open this
    # database. Use mode=ro to serve a database read-only.
    params: mode=ro&immutable=true
    # Extensions loaded for this database only, after the global ones above.
    # Repeating a global extension here is a no-op.
    extensions:
      - path: /usr/lib/sqlite3/spellfix.so
        entrypoint: sqlite3_spellfix_init
  cached:
    path: /var/lib/lsqlited/cached.sqlite3
    # The mapping form works too.
    params:
      cache: shared
      _synchronous: NORMAL
